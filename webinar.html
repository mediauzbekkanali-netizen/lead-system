<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bolangizni sog'lom ovqatlantirishni bepulga o'rgataman, 1-avgust vebinar</title>
<meta name="description" content="6 oydan 6 yoshgacha bo'lgan bolalar uchun ovqatlanish asoslari. Ziyoda Xo'jaeva bilan bepul vebinar, 1-avgust. Telegram kanalga qo'shiling." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6ef;
    --card: #ffffff;
    --text: #1c2118;
    --text-muted: #5b6552;
    --border: #e4e8da;
    --accent: #6b3220;
    --accent-strong: #4a2114;
    --accent-tint: #ead9cf;
    --shadow: 0 30px 60px -28px rgba(28, 33, 24, 0.28);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14170f;
      --card: #1e2317;
      --text: #edf0e6;
      --text-muted: #a7b198;
      --border: #303827;
      --accent: #b9714f;
      --accent-strong: #d18a63;
      --accent-tint: #3a241a;
      --shadow: 0 30px 60px -28px rgba(0, 0, 0, 0.6);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(120% 90% at 50% -10%, var(--accent-tint) 0%, var(--bg) 55%);
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    color: var(--text);
    padding: 32px 18px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 620px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 26px;
    box-shadow: var(--shadow);
    padding: 32px;
  }

  .badges {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 26px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    font-weight: 700;
  }

  .badge .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .badge-right {
    padding: 7px 14px;
    border-radius: 999px;
    background: var(--accent-tint);
    color: var(--accent-strong);
  }

  h1 {
    font-size: clamp(28px, 5.2vw, 38px);
    line-height: 1.18;
    letter-spacing: -0.01em;
    font-weight: 800;
    margin-bottom: 16px;
  }

  h1 .highlight {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 3px;
    text-underline-offset: 4px;
    text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent);
  }

  .subtext {
    font-size: 16px;
    color: var(--text-muted);
    max-width: 52ch;
    margin-bottom: 26px;
  }

  .photo-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    border-radius: 18px;
    overflow: hidden;
    background: linear-gradient(160deg, var(--accent-tint), var(--border));
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 26px;
  }

  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .photo-frame .monogram {
    font-size: 88px;
    font-weight: 800;
    color: var(--accent-strong);
  }

  /* TODO: replace the .monogram span with
     <img src="images/ziyoda.jpg" alt="Ziyoda Xo'jaeva"> once the real photo file is added to the repo */

  .cta-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 18px;
    border-radius: 14px;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .cta-btn:hover { background: var(--accent-strong); }
  .cta-btn:active { transform: scale(0.98); }

  .cta-btn svg { flex-shrink: 0; }

  .caption {
    text-align: center;
    font-size: 13.5px;
    color: var(--text-muted);
    margin-top: 16px;
  }

  .caption strong { color: var(--text); font-weight: 700; }

  @media (max-width: 480px) {
    .card { padding: 22px; border-radius: 20px; }
    .cta-btn { font-size: 15px; gap: 8px; padding: 16px 10px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="badges">
      <span class="badge">
        <span class="dot"></span>
        Prikorm &amp; BLW
      </span>
      <span class="badge badge-right">
        <span class="dot"></span>
        1-avgust
      </span>
    </div>

    <h1>Bolangizni 6 Oydan <span class="highlight">Sog'lom Ovqatlantirishni</span> Bepulga O'rgataman</h1>

    <p class="subtext">Bepul jonli vebinar: 6 oydan 6 yoshgacha bo'lgan bolalar uchun ovqatlanish asoslari, boshidan oxirigacha, bosqichma-bosqich.</p>

    <div class="photo-frame">
      <span class="monogram">ZX</span>
    </div>

    <a class="cta-btn" href="https://t.me/+Xo0lWpOrr0liYzJi" target="_blank" rel="noopener">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21.05 2.93a1.5 1.5 0 0 0-1.56-.24L2.6 9.87a1.4 1.4 0 0 0 .07 2.6l4.55 1.52 1.77 5.6a1.3 1.3 0 0 0 2.16.5l2.5-2.4 4.4 3.24a1.4 1.4 0 0 0 2.22-.85l2.68-14.5a1.5 1.5 0 0 0-.9-1.65ZM8.98 13.6l8.6-6.9c.25-.2.5.13.28.35l-7.2 6.98a1.2 1.2 0 0 0-.34.68l-.27 2.4-1.07-3.5Z"/></svg>
      Telegram kanalga qo'shilish
    </a>

    <p class="caption"><strong>1-avgust</strong> &middot; Ishtirok butunlay bepul</p>
  </div>

</body>
</html>
