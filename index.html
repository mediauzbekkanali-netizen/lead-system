<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reklama Dashboard</title>
<style>
  :root{
    --bg:#0b1020; --bg2:#111832; --card:#151d3b; --card2:#1b2547;
    --line:#26304f; --text:#eef2ff; --muted:#93a0c4; --brand:#5b8cff;
    --green:#28c76f; --amber:#ffb547; --red:#ff5d6c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:
    radial-gradient(1200px 600px at 80% -10%, #1a2550 0%, transparent 60%), var(--bg);
    color:var(--text);min-height:100vh}
  a{color:var(--brand)}
  .hidden{display:none!important}

  /* ── Login ── */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:40px 34px;width:100%;max-width:400px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
  .logo{font-size:15px;font-weight:800;letter-spacing:.5px;color:var(--brand);margin-bottom:22px}
  .login-card h1{font-size:23px;margin-bottom:6px}
  .login-card p.sub{color:var(--muted);font-size:14px;margin-bottom:26px}
  label{display:block;font-size:13px;font-weight:600;color:#c3cdf0;margin:0 0 6px}
  input,select{width:100%;padding:13px 14px;background:var(--bg2);border:1px solid var(--line);
    border-radius:11px;font-size:15px;color:var(--text);outline:none;transition:border-color .15s}
  input:focus,select:focus{border-color:var(--brand)}
  .field{margin-bottom:16px}
  button.primary{width:100%;padding:14px;background:linear-gradient(135deg,#5b8cff,#3f6fe0);
    color:#fff;font-size:15px;font-weight:700;border:none;border-radius:11px;cursor:pointer;transition:opacity .15s}
  button.primary:hover{opacity:.92}
  button.primary:disabled{opacity:.55;cursor:not-allowed}
  .msg{font-size:13px;margin-top:14px;padding:11px 13px;border-radius:10px;display:none}
  .msg.err{display:block;background:rgba(255,93,108,.12);color:#ff9aa4;border:1px solid rgba(255,93,108,.3)}

  /* ── App shell ── */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(11,16,32,.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .topbar .brand{font-weight:800;color:var(--brand);font-size:15px}
  .topbar .who{color:var(--muted);font-size:13px}
  .topbar .who b{color:var(--text)}
  .spacer{flex:1}
  .ctrl{display:flex;align-items:center;gap:8px}
  select.range{width:auto;padding:8px 12px;font-size:13px}
  button.ghost{background:var(--card2);border:1px solid var(--line);color:var(--text);
    padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
  button.ghost:hover{border-color:var(--brand)}
  .wrap{max-width:1200px;margin:0 auto;padding:22px 20px 60px}

  /* ── Summary tiles ── */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .tile .t-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .tile .t-value{font-size:26px;font-weight:800;margin-top:8px}
  .tile .t-sub{font-size:12px;color:var(--muted);margin-top:4px}

  .section-title{font-size:15px;font-weight:700;margin:6px 0 14px;display:flex;align-items:center;gap:10px}
  .section-title .count{background:var(--card2);border:1px solid var(--line);color:var(--muted);
    font-size:12px;padding:2px 9px;border-radius:20px}

  /* ── Ad cards ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .ad{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    display:flex;flex-direction:column;transition:transform .12s,border-color .12s}
  .ad:hover{transform:translateY(-3px);border-color:var(--brand)}
  .thumb{position:relative;aspect-ratio:16/10;background:var(--bg2);overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#4b5680;font-size:34px}
  .badge{position:absolute;top:10px;left:10px;background:rgba(40,199,111,.95);color:#04240f;
    font-size:11px;font-weight:800;padding:4px 9px;border-radius:20px;display:flex;align-items:center;gap:5px}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:#04240f;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .vbadge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;
    font-weight:700;padding:4px 8px;border-radius:8px}
  .ad-body{padding:14px 15px 16px;flex:1;display:flex;flex-direction:column}
  .ad-name{font-size:14px;font-weight:700;line-height:1.35;margin-bottom:4px}
  .ad-camp{font-size:12px;color:var(--muted);margin-bottom:12px}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
  .m{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
  .m .k{font-size:11px;color:var(--muted);font-weight:600}
  .m .v{font-size:16px;font-weight:800;margin-top:2px}
  .m.hl .v{color:var(--green)}

  /* ── Trend chart ── */
  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 12px;margin-bottom:24px}
  .chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .chart-head .title{font-size:14px;font-weight:700}
  .chart-head .legend{font-size:12px;color:var(--muted)}
  .bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:6px}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
  .bar-wrap{width:100%;height:110px;display:flex;align-items:flex-end;justify-content:center}
  .bar{width:70%;max-width:34px;background:linear-gradient(180deg,#5b8cff,#3f6fe0);border-radius:6px 6px 0 0;
    min-height:3px;position:relative;transition:opacity .12s;cursor:default}
  .bar:hover{opacity:.85}
  .bar .tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;white-space:nowrap;
    background:#0a0f22;border:1px solid var(--line);color:var(--text);font-size:11px;padding:5px 8px;border-radius:8px;
    opacity:0;pointer-events:none;transition:opacity .12s;z-index:5}
  .bar:hover .tip{opacity:1}
  .bar-lbl{font-size:10px;color:var(--muted);white-space:nowrap}

  /* ── Modal ── */
  .modal-back{position:fixed;inset:0;background:rgba(4,7,17,.72);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:18px;width:100%;max-width:520px;
    max-height:90vh;overflow:auto;position:relative}
  .modal-x{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.4);color:#fff;border:none;
    width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:14px;z-index:2}
  .modal-thumb{aspect-ratio:16/9;background:var(--bg2);overflow:hidden}
  .modal-thumb img{width:100%;height:100%;object-fit:cover}
  .modal-thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:44px;color:#4b5680}
  .modal-in{padding:20px}
  .modal-in h3{font-size:18px;margin-bottom:4px}
  .modal-in .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .mgrid .m .v{font-size:18px}
  .btn-fb{display:inline-block;width:100%;text-align:center;padding:12px;background:var(--card2);
    border:1px solid var(--line);border-radius:11px;color:var(--brand);font-weight:700;text-decoration:none;font-size:14px}
  .btn-fb:hover{border-color:var(--brand)}

  .state{text-align:center;padding:70px 20px;color:var(--muted)}
  .state .big{font-size:44px;margin-bottom:14px}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);
    border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .foot{color:var(--muted);font-size:12px;margin-top:26px;text-align:center}
</style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="logo">📊 REKLAMA DASHBOARD</div>
    <h1>Kabinetga kirish</h1>
    <p class="sub">Biznesingizga berilgan login va parolni kiriting.</p>
    <form id="loginForm">
      <div class="field">
        <label for="login">Login</label>
        <input id="login" autocomplete="username" placeholder="biznes_login" />
      </div>
      <div class="field">
        <label for="password">Parol</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button class="primary" id="loginBtn" type="submit">Kirish</button>
      <div class="msg err" id="loginMsg"></div>
    </form>
    <div id="demoHint" class="hidden" style="margin-top:18px;padding:12px 14px;border-radius:12px;
      background:rgba(91,140,255,.10);border:1px solid rgba(91,140,255,.35);font-size:13px;color:#c3cdf0">
      🎬 <b>Demo rejim</b> — sinab ko'rish uchun:<br>
      Login: <b style="color:#eef2ff">demo</b> &nbsp;·&nbsp; Parol: <b style="color:#eef2ff">demo123</b><br>
      <span style="color:#93a0c4">Haqiqiy ma'lumot ulangach bu yozuv yo'qoladi.</span>
    </div>
    <p class="foot" style="margin-top:22px">Login/parol yo'qmi? Admin bilan bog'laning.</p>
  </div>
</div>

<!-- ═══════════ DASHBOARD ═══════════ -->
<div id="appView" class="hidden">
  <div class="topbar">
    <span class="brand">📊 Dashboard</span>
    <span class="who">Biznes: <b id="bizName">—</b></span>
    <span class="spacer"></span>
    <div class="ctrl">
      <select class="range" id="rangeSel">
        <option value="today">Bugun</option>
        <option value="yesterday">Kecha</option>
        <option value="last_7d" selected>So'nggi 7 kun</option>
        <option value="last_14d">So'nggi 14 kun</option>
        <option value="last_30d">So'nggi 30 kun</option>
        <option value="this_month">Shu oy</option>
        <option value="lifetime">Butun davr</option>
      </select>
      <button class="ghost" id="refreshBtn">↻ Yangilash</button>
      <button class="ghost" id="logoutBtn">Chiqish</button>
    </div>
  </div>

  <div class="wrap">
    <div class="tiles" id="tiles"></div>
    <div id="trendBox"></div>
    <div class="section-title">🎬 Aktiv reklamalar <span class="count" id="adCount">0</span></div>
    <div id="content"></div>
    <div class="foot" id="updated"></div>
  </div>
</div>

<!-- Reklama batafsil oynasi -->
<div id="modal" class="modal-back hidden">
  <div class="modal">
    <button class="modal-x" id="modalX">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const API = "";                         // shu domen
const TOKEN_KEY = "dash_token";
const NAME_KEY  = "dash_name";

const $ = (id) => document.getElementById(id);
const token = () => localStorage.getItem(TOKEN_KEY);

function fmtNum(n){ n=Number(n||0); return n>=1000? n.toLocaleString("ru-RU") : String(Math.round(n)); }
function fmtMoney(n,cur){ n=Number(n||0); return n.toLocaleString("ru-RU",{maximumFractionDigits:2}) + (cur? " "+cur : ""); }

// ── Auth flow ──
function showApp(){ $("loginView").classList.add("hidden"); $("appView").classList.remove("hidden"); }
function showLogin(){ $("appView").classList.add("hidden"); $("loginView").classList.remove("hidden"); }
function logout(){ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(NAME_KEY); showLogin(); }

$("loginForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const btn=$("loginBtn"), msg=$("loginMsg");
  msg.style.display="none";
  const login=$("login").value.trim(), password=$("password").value;
  if(!login||!password){ msg.textContent="Login va parolni kiriting"; msg.classList.add("err"); msg.style.display="block"; return; }
  btn.disabled=true; btn.textContent="Kirilmoqda...";
  try{
    const r=await fetch(API+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({login,password})});
    const d=await r.json();
    if(!r.ok||!d.ok) throw new Error(d.error||"Kirishda xatolik");
    localStorage.setItem(TOKEN_KEY,d.token);
    localStorage.setItem(NAME_KEY,d.project.name||d.project.login);
    startDashboard();
  }catch(err){ msg.textContent=err.message; msg.classList.add("err"); msg.style.display="block"; }
  finally{ btn.disabled=false; btn.textContent="Kirish"; }
});

$("logoutBtn").addEventListener("click", logout);
$("refreshBtn").addEventListener("click", loadAds);
$("rangeSel").addEventListener("change", loadAds);

// ── Dashboard ──
function startDashboard(){
  showApp();
  $("bizName").textContent = localStorage.getItem(NAME_KEY) || "—";
  loadAds();
}

function skeleton(){
  $("tiles").innerHTML="";
  $("content").innerHTML = `<div class="state"><div class="spinner"></div>Reklamalar Facebook'dan yuklanmoqda...</div>`;
  $("updated").textContent="";
}

async function loadAds(){
  if(!token()){ showLogin(); return; }
  skeleton();
  const range=$("rangeSel").value;
  try{
    const r=await fetch(API+"/api/ads?range="+encodeURIComponent(range),{
      headers:{ "Authorization":"Bearer "+token() }});
    if(r.status===401){ logout(); return; }
    const d=await r.json();
    if(!r.ok||!d.ok) throw new Error(d.error||"Ma'lumot olinmadi");
    render(d);
  }catch(err){
    $("tiles").innerHTML="";
    $("content").innerHTML=`<div class="state"><div class="big">⚠️</div>${err.message}</div>`;
    $("adCount").textContent="0";
  }
}

let _ads=[], _cur="";
function render(d){
  const cur=d.currency||""; _cur=cur;
  const s=d.summary||{};
  $("adCount").textContent = s.activeAds||0;

  $("tiles").innerHTML = [
    tile("Aktiv reklamalar", fmtNum(s.activeAds), "hozir ishlayapti"),
    tile("Sarflangan", fmtMoney(s.spend,cur), "tanlangan davr"),
    tile("Natijalar", fmtNum(s.results), "lid / yozishma / xarid"),
    tile("Ko'rsatishlar", fmtNum(s.impressions), "impressions"),
    tile("Qamrov", fmtNum(s.reach), "reach"),
  ].join("");

  renderTrend(d.trend||[], cur);

  const ads=d.ads||[]; _ads=ads;
  if(!ads.length){
    $("content").innerHTML=`<div class="state"><div class="big">😴</div>
      Bu davrda aktiv ishlayotgan reklama topilmadi.</div>`;
  } else {
    $("content").innerHTML = `<div class="grid">${ads.map((a,i)=>adCard(a,cur,i)).join("")}</div>`;
    document.querySelectorAll("[data-ad]").forEach(el=>el.onclick=()=>openModal(+el.getAttribute("data-ad")));
  }
  const t=new Date(d.updatedAt||Date.now());
  $("updated").textContent = "So'nggi yangilanish: "+t.toLocaleString("ru-RU");
}

function renderTrend(trend,cur){
  const box=$("trendBox");
  if(!trend || trend.length<2){ box.innerHTML=""; return; }
  const max=Math.max(...trend.map(x=>x.spend),1);
  const bars=trend.map(x=>{
    const h=Math.round((x.spend/max)*100);
    const d=new Date(x.date);
    const lbl=isNaN(d)? x.date : (d.getDate()+"."+(d.getMonth()+1));
    return `<div class="bar-col">
      <div class="bar-wrap"><div class="bar" style="height:${Math.max(h,2)}%">
        <span class="tip">${fmtMoney(x.spend,cur)} · ${fmtNum(x.results)} natija</span>
      </div></div>
      <div class="bar-lbl">${lbl}</div>
    </div>`;
  }).join("");
  box.innerHTML=`<div class="chart-card">
    <div class="chart-head"><span class="title">📈 Kunlik sarf</span>
      <span class="legend">ustunga bosing/hovering — sarf va natija</span></div>
    <div class="bars">${bars}</div>
  </div>`;
}

function tile(label,value,sub){
  return `<div class="tile"><div class="t-label">${label}</div>
    <div class="t-value">${value}</div><div class="t-sub">${sub}</div></div>`;
}

function esc(s){ return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function adCard(a,cur,i){
  const thumb = a.thumbnail
    ? `<img src="${esc(a.thumbnail)}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=&quot;ph&quot;>🖼️</div>'" />`
    : `<div class="ph">🖼️</div>`;
  const vbadge = a.isVideo ? `<span class="vbadge">▶ Video</span>` : "";
  return `<div class="ad" data-ad="${i}">
    <div class="thumb">
      ${thumb}
      <span class="badge"><span class="dot"></span> Ishlayapti</span>
      ${vbadge}
    </div>
    <div class="ad-body">
      <div class="ad-name">${esc(a.name)}</div>
      <div class="ad-camp">${esc(a.campaign||"")}</div>
      <div class="metrics">
        <div class="m hl"><div class="k">${esc(a.resultLabel||"Natija")}</div><div class="v">${fmtNum(a.results)}</div></div>
        <div class="m"><div class="k">Sarf</div><div class="v">${fmtMoney(a.spend,cur)}</div></div>
        <div class="m"><div class="k">Ko'rsatish</div><div class="v">${fmtNum(a.impressions)}</div></div>
        <div class="m"><div class="k">CTR</div><div class="v">${(Number(a.ctr||0)).toFixed(2)}%</div></div>
        ${a.isVideo?`<div class="m"><div class="k">Video ko'rish</div><div class="v">${fmtNum(a.thruplays)}</div></div>`:""}
        <div class="m"><div class="k">CPM</div><div class="v">${fmtMoney(a.cpm,cur)}</div></div>
      </div>
    </div>
  </div>`;
}

// ── Batafsil oyna ──
function openModal(i){
  const a=_ads[i]; if(!a) return;
  const cur=_cur;
  const thumb = a.thumbnail
    ? `<img src="${esc(a.thumbnail)}" onerror="this.parentNode.innerHTML='<div class=&quot;ph&quot;>🖼️</div>'" />`
    : `<div class="ph">🖼️</div>`;
  const acct=String(a.account||"").replace("act_","");
  const fbLink = acct && a.id
    ? `https://www.facebook.com/adsmanager/manage/ads?act=${encodeURIComponent(acct)}&selected_ad_ids=${encodeURIComponent(a.id)}`
    : "";
  const m=(k,v)=>`<div class="m"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  $("modalBody").innerHTML=`
    <div class="modal-thumb">${thumb}</div>
    <div class="modal-in">
      <h3>${esc(a.name)}</h3>
      <div class="sub">${esc(a.campaign||"")}${a.adset?" · "+esc(a.adset):""}${a.isVideo?" · ▶ Video":""}</div>
      <div class="mgrid">
        ${m(esc(a.resultLabel||"Natija"), fmtNum(a.results))}
        ${m("Sarf", fmtMoney(a.spend,cur))}
        ${m("Ko'rsatishlar", fmtNum(a.impressions))}
        ${m("Qamrov", fmtNum(a.reach))}
        ${m("Bosishlar", fmtNum(a.clicks))}
        ${m("CTR", (Number(a.ctr||0)).toFixed(2)+"%")}
        ${m("CPC", fmtMoney(a.cpc,cur))}
        ${m("CPM", fmtMoney(a.cpm,cur))}
        ${a.isVideo?m("Video ko'rish (ThruPlay)", fmtNum(a.thruplays)):""}
        ${m("Chastota", (Number(a.frequency||0)).toFixed(2))}
      </div>
      ${fbLink?`<a class="btn-fb" href="${fbLink}" target="_blank" rel="noopener">Ads Manager'da ochish ↗</a>`:""}
    </div>`;
  $("modal").classList.remove("hidden");
}
function closeModal(){ $("modal").classList.add("hidden"); }
$("modalX").addEventListener("click", closeModal);
$("modal").addEventListener("click", (e)=>{ if(e.target.id==="modal") closeModal(); });
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeModal(); });

// ── Demo ishorasi (faqat demo rejimda) ──
fetch(API+"/api/status").then(r=>r.json()).then(d=>{
  if(d && d.demo){ $("demoHint").classList.remove("hidden"); }
}).catch(()=>{});

// ── Boshlash ──
if(token()) startDashboard(); else showLogin();
</script>
</body>
</html>
