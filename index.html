<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bepul Konsultatsiya</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }

    .badge {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 50px;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #1a1a2e;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    p.subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 32px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 15px;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }

    input:focus { border-color: #0f3460; }

    input.error { border-color: #e53935; }

    .error-msg {
      font-size: 12px;
      color: #e53935;
      margin-top: -14px;
      margin-bottom: 14px;
      display: none;
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #0f3460, #e94560);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.3px;
    }

    button:hover { opacity: 0.92; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .success {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .success .icon { font-size: 52px; margin-bottom: 12px; }
    .success h2 { font-size: 22px; color: #2e7d32; margin-bottom: 8px; }
    .success p { color: #555; font-size: 14px; }

    .privacy {
      text-align: center;
      font-size: 12px;
      color: #999;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="form-section">
      <span class="badge">✅ Bepul · Majburiyatsiz</span>
      <h1>Bepul Konsultatsiya Olish</h1>
      <p class="subtitle">Ma'lumotlaringizni qoldiring — 30 daqiqa ichida bog'lanamiz.</p>

      <form id="leadForm" novalidate>
        <label for="name">Ismingiz</label>
        <input type="text" id="name" name="name" placeholder="Masalan: Alisher" autocomplete="name" />
        <div class="error-msg" id="nameErr">Ism kiritilmagan</div>

        <label for="phone">Telefon raqamingiz</label>
        <input type="tel" id="phone" name="phone" placeholder="+998 90 123 45 67" autocomplete="tel" />
        <div class="error-msg" id="phoneErr">To'g'ri raqam kiriting</div>

        <button type="submit" id="submitBtn">📩 Ariza Yuborish</button>
      </form>

      <p class="privacy">🔒 Ma'lumotlaringiz maxfiy saqlanadi</p>
    </div>

    <div class="success" id="success-section">
      <div class="icon">🎉</div>
      <h2>Ariza qabul qilindi!</h2>
      <p>Tez orada siz bilan bog'lanamiz.<br/>Telefoningizni yonida tutib turing.</p>
    </div>
  </div>

  <script>
    const GAS_URL = "YOUR_GAS_WEBHOOK_URL"; // <-- bu yerga GAS URL qo'ying

    const form = document.getElementById("leadForm");
    const btn  = document.getElementById("submitBtn");

    function showError(inputId, errId, show) {
      document.getElementById(inputId).classList.toggle("error", show);
      document.getElementById(errId).style.display = show ? "block" : "none";
    }

    function validatePhone(p) {
      return /^[\+]?[\d\s\-\(\)]{9,15}$/.test(p.trim());
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name  = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();

      let valid = true;

      if (!name) { showError("name", "nameErr", true); valid = false; }
      else        { showError("name", "nameErr", false); }

      if (!validatePhone(phone)) { showError("phone", "phoneErr", true); valid = false; }
      else                       { showError("phone", "phoneErr", false); }

      if (!valid) return;

      btn.disabled = true;
      btn.textContent = "Yuborilmoqda...";

      try {
        const res = await fetch("/api/lead", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, phone }),
        });

        const data = await res.json();

        if (res.ok && data.success) {
          document.getElementById("form-section").style.display = "none";
          document.getElementById("success-section").style.display = "block";
        } else {
          throw new Error(data.error || "Xatolik yuz berdi");
        }
      } catch (err) {
        alert("❌ " + err.message + "\nQayta urinib ko'ring.");
        btn.disabled = false;
        btn.textContent = "📩 Ariza Yuborish";
      }
    });
  </script>
</body>
</html>
